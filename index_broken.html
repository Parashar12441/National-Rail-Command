<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRIS | Central Command & Control</title>

    <!-- Indian Railways / LED Station Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&family=VT323&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Leaflet CSS & JS for Live Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Rajdhani', 'sans-serif'],
                        mono: ['Share Tech Mono', 'monospace'],
                        led: ['VT323', 'monospace'],
                    },
                    colors: {
                        cmd: {
                            bg: '#01050e',
                            panel: '#041024',
                            border: '#1a365d',
                            accent: '#ffb300',
                            irblue: '#003399',
                            text: '#a0aec0',
                            bright: '#ffffff',
                            danger: '#ff3333',
                            warning: '#ff9933',
                            success: '#00ff66'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #01050e;
            color: #a0aec0;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 50%, #041024 0%, #01050e 100%);
        }

        .glass-panel {
            background: rgba(10, 15, 30, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 229, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        @keyframes fencePulse {
            0% {
                stroke-opacity: 1;
                stroke-width: 4px;
                filter: drop-shadow(0 0 2px #ff2a2a);
            }

            50% {
                stroke-opacity: 0.5;
                stroke-width: 6px;
                filter: drop-shadow(0 0 10px #ff2a2a);
            }

            100% {
                stroke-opacity: 1;
                stroke-width: 4px;
                filter: drop-shadow(0 0 2px #ff2a2a);
            }
        }

        .geo-fence-pulse {
            animation: fencePulse 1.5s infinite;
        }

        body.red-alert * {
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
        }

        body.red-alert .text-cmd-accent,
        body.red-alert .text-cmd-success,
        body.red-alert .text-cmd-warning,
        body.red-alert [class*="text-[#00E5FF]"] {
            color: #ff2a2a !important;
        }

        body.red-alert .border-cmd-accent,
        body.red-alert .border-cmd-success,
        body.red-alert [class*="border-[#00E5FF]"] {
            border-color: #ff2a2a !important;
        }

        body.red-alert .bg-cmd-accent,
        body.red-alert [class*="bg-[#00E5FF]"] {
            background-color: #ff2a2a !important;
        }

        body.red-alert .leaflet-tile-pane {
            filter: sepia(1) hue-rotate(320deg) saturate(5) contrast(1.2) !important;
        }

        body.red-alert .cmd-panel {
            border-color: #ff2a2a !important;
            box-shadow: 0 0 15px rgba(255, 42, 42, 0.2);
        }

        .alarm-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 0, 0, 0.1);
            z-index: 9998;
            pointer-events: none;
            animation: flashAlarm 2s infinite;
        }

        body.red-alert .alarm-overlay {
            display: block;
        }

        @keyframes flashAlarm {

            0%,
            100% {
                opacity: 0;
            }

            50% {
                opacity: 1;
            }
        }

        @keyframes trainMove {
            0% {
                transform: translateX(-150%);
            }

            100% {
                transform: translateX(150vw);
            }
        }

        .train-animation {
            animation: trainMove 12s linear infinite;
            will-change: transform;
        }


        .cmd-panel {
            background: rgba(4, 16, 36, 0.9);
            border: 1px solid var(--tw-colors-cmd-border);
            position: relative;
        }

        }

        @keyframes flash-critical {
            0% {
                background-color: #ff2a2a;
                opacity: 1;
            }

            50% {
                background-color: transparent;
                opacity: 0.2;
                border: 1px solid #ff2a2a;
            }

            100% {
                background-color: #ff2a2a;
                opacity: 1;
            }
        }

        .train-marker.delayed {
            animation: flash-critical 1s infinite step-end;
        }

        }
        // ---------------------------

        async function runWhatIf() {
            const input = document.getElementById('whatif-input').value;
            if (!input.trim()) return;
            const btn = document.getElementById('whatif-run-btn');
            const resContainer = document.getElementById('whatif-result');

            btn.disabled = true;
            btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 mr-2 inline animate-spin"></i> SIMULATING ENTIRE NETWORK...`;
            resContainer.innerHTML = `
                <div class="rv-card rv-fade-in flex flex-col items-center justify-center gap-3" style="border-color:rgba(0,229,255,0.35);padding:36px;min-height:300px">
                    <div class="text-[#00E5FF] mb-2"><i data-lucide="sparkles" class="w-10 h-10 animate-pulse"></i></div>
                    <div style="font-size:16px;font-weight:600;color:#00E5FF">Simulating Railway Network...</div>
                    <div style="font-size:13px;color:#4A6580;text-align:center;max-width:440px">Analyzing cascade effects · calculating passenger impact · generating strategic response plan</div>
                    ${['Parsing scenario parameters...', 'Modeling network-wide cascades...', 'Computing passenger impact...', 'Generating action plan...'].map(step => `
                            <span style="font-size:12px;color:#4A6580">${step}</span>
                        </div>
                    `).join('')}
                </div>`;
            if (window.lucide) window.lucide.createIcons();

            
            try {
                const riskData = await evaluateRiskEngine(input);
                
                const res = {
                    scenario_summary: `Full network analysis for: ${input.slice(0, 70)}...`,
                    risk_level: riskData.risk_level,
                    affected_trains: Math.round(riskData.overallScore / 3),
                    passenger_impact: riskData.overallScore * 400,
                    key_impacts: riskData.consequences.slice(0, 3),
                    cascade_effects: [`Hidden Risk: ${riskData.hiddenRisk}`],
                    recommended_actions: ['Activate emergency operations protocol immediately', 'Pre-position additional RPF staff', 'Issue real-time advisories'],
                    estimated_recovery: riskData.overallScore > 75 ? '8-12 hours' : '2-4 hours',
                    ai_assessment: `Dynamic AI Risk Engine Score: ${riskData.overallScore}/100. Safety: ${riskData.safety}, Crowd: ${riskData.crowd}, Delay: ${riskData.delay}, Network: ${riskData.network}, Resource: ${riskData.resources}.`,
                    risk_drivers: riskData.risk_drivers || [],
                    comparison: riskData.comparison || {
                        current: { crowd_percent: "N/A", delay: "N/A", affected_trains: "N/A", network_risk: "N/A" },
                        after_action: { crowd_percent: "N/A", delay: "N/A", affected_trains: "N/A", network_risk: "N/A" }
                    },
                    safer_alternative: riskData.safer_alternative || null,
                    mitigation_checklist: riskData.mitigation_checklist || []
                };

                const riskColor = rCo(res.risk_level);

                resContainer.innerHTML = `
                    <div class="rv-fade-in">
                        <!-- Status Timeline -->
                        <div class="rv-card mb-4" style="padding:16px;border-color:rgba(0,229,255,0.3)">
                            <div class="flex justify-between items-center relative z-10">
                                <div class="absolute w-full h-0.5 bg-gray-800 top-1/2 -z-10 -translate-y-1/2"></div>
                                
                                <div class="flex flex-col items-center gap-1 bg-[#041024] px-2">
                                    <div class="w-6 h-6 rounded-full bg-cmd-success text-black flex items-center justify-center"><i data-lucide="check" class="w-4 h-4"></i></div>
                                    <div class="text-[9px] font-mono text-gray-400">ANALYSIS</div>
                                </div>
                                <div class="flex flex-col items-center gap-1 bg-[#041024] px-2">
                                    <div class="w-6 h-6 rounded-full bg-cmd-success text-black flex items-center justify-center"><i data-lucide="check" class="w-4 h-4"></i></div>
                                    <div class="text-[9px] font-mono text-gray-400">AGENTS</div>
                                </div>
                                <div id="status-step-mitigation" class="flex flex-col items-center gap-1 bg-[#041024] px-2">
                                    <div class="w-6 h-6 rounded-full border border-[#00FF94] bg-[#00FF94]/20 text-[#00FF94] flex items-center justify-center"><i data-lucide="shield" class="w-3 h-3"></i></div>
                                    <div class="text-[9px] font-mono text-[#00FF94]">MITIGATION</div>
                                </div>
                                <div id="status-step-approval" class="flex flex-col items-center gap-1 bg-[#041024] px-2">
                                    <div class="w-6 h-6 rounded-full border border-gray-600 bg-gray-900 text-gray-500 flex items-center justify-center"><i data-lucide="user-check" class="w-3 h-3"></i></div>
                                    <div class="text-[9px] font-mono text-gray-500">APPROVAL</div>
                                </div>
                                <div id="status-step-executed" class="flex flex-col items-center gap-1 bg-[#041024] px-2">
                                    <div class="w-6 h-6 rounded-full border border-gray-600 bg-gray-900 text-gray-500 flex items-center justify-center"><i data-lucide="zap" class="w-3 h-3"></i></div>
                                    <div class="text-[9px] font-mono text-gray-500">EXECUTED</div>
                                </div>
                            </div>
                            <div class="mt-4 bg-[#00FF94]/10 border border-[#00FF94]/30 rounded p-2 text-center transition-all duration-300">
                                <div class="text-[11px] font-mono text-[#00FF94]">NEXT STEP: <span id="timeline-next-step" class="text-white">Review mitigation checklist and authorize deployment.</span></div>
                            </div>
                        </div>

                        <div style="background:${riskColor}12;border:1px solid ${riskColor}35;border-radius:12px;padding:14px 18px;margin-bottom:14px;display:flex;align-items:center;gap:14px">
                            <div style="width:52px;height:52px;border-radius:10px;background:${riskColor}18;display:flex;align-items:center;justify-content:center;flex-shrink:0" class="text-[${riskColor}]">${res.risk_level === 'CRITICAL' ? '<i data-lucide="siren" class="w-7 h-7"></i>' : '<i data-lucide="alert-triangle" class="w-7 h-7"></i>'}</div>
                            <div>
                                <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
                                    <span style="font-size:15px;font-weight:700">Scenario Analysis Complete</span>
                                    <span style="background:${riskColor}18;color:${riskColor};padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700">${res.risk_level} RISK</span>
                                </div>
                                <div style="font-size:13px;color:#8BA8C8;line-height:1.5">${res.scenario_summary}</div>
                            </div>
                        </div>

                        <div class="rv-metrics-grid" style="margin-bottom:14px">
                            <div class="rv-card" style="padding:12px 10px;text-align:center"><div class="flex justify-center mb-1 text-gray-400"><i data-lucide="train-front" class="w-6 h-6"></i></div><div style="font-size:20px;font-weight:900;color:#FF9500;font-family:'JetBrains Mono',monospace;line-height:1.2;margin-bottom:3px">${res.affected_trains}</div><div style="font-size:10px;color:#4A6580;text-transform:uppercase;letter-spacing:0.07em">Affected Trains</div></div>
                            <div class="rv-card" style="padding:12px 10px;text-align:center"><div class="flex justify-center mb-1 text-gray-400"><i data-lucide="users" class="w-6 h-6"></i></div><div style="font-size:20px;font-weight:900;color:#A855F7;font-family:'JetBrains Mono',monospace;line-height:1.2;margin-bottom:3px">${res.passenger_impact.toLocaleString()}</div><div style="font-size:10px;color:#4A6580;text-transform:uppercase;letter-spacing:0.07em">Passengers Impacted</div></div>
                            <div class="rv-card" style="padding:12px 10px;text-align:center"><div class="flex justify-center mb-1 text-gray-400"><i data-lucide="clock-alert" class="w-6 h-6"></i></div><div style="font-size:12px;font-weight:900;color:#00E5FF;font-family:inherit;line-height:1.2;margin-bottom:3px;margin-top:8px">${res.estimated_recovery}</div><div style="font-size:10px;color:#4A6580;text-transform:uppercase;letter-spacing:0.07em">Recovery Time</div></div>
                            <div class="rv-card" style="padding:12px 10px;text-align:center"><div class="flex justify-center mb-1" style="color:${riskColor}"><i data-lucide="alert-triangle" class="w-6 h-6"></i></div><div style="font-size:12px;font-weight:900;color:${riskColor};font-family:inherit;line-height:1.2;margin-bottom:3px;margin-top:8px">${res.risk_level}</div><div style="font-size:10px;color:#4A6580;text-transform:uppercase;letter-spacing:0.07em">Risk Level</div></div>
                        </div>

                        <div class="rv-impact-grid">
                            <div class="rv-card" style="padding:14px">
                                <div class="rv-section-title text-cmd-warning">KEY IMPACTS</div>
                                ${res.key_impacts.map(i => `<div class="rv-bullet"><span class="rv-bullet-icon text-cmd-warning">▸</span><span class="rv-bullet-text">${i}</span></div>`).join('')}
                            </div>
                            <div class="rv-card" style="padding:14px">
                                <div class="rv-section-title text-cmd-danger">CASCADE EFFECTS</div>
                                ${res.cascade_effects.map(i => `<div class="rv-bullet"><span class="rv-bullet-icon text-cmd-danger">▸</span><span class="rv-bullet-text">${i}</span></div>`).join('')}
                            </div>
                            <div class="rv-card" style="padding:14px;border-color:rgba(0,229,255,0.25)">
                                <div class="rv-section-title text-cmd-accent">RECOMMENDED ACTIONS</div>
                                ${res.recommended_actions.map((a, i) => `
                                    <div style="display:flex;gap:8px;margin-bottom:7px;padding:5px 7px;background:#0F1F3D;border-radius:5px">
                                        <span style="color:#00E5FF;font-weight:700;flex-shrink:0;font-size:12px">${i + 1}.</span>
                                        <span style="font-size:13px;color:#8BA8C8;line-height:1.45">${a}</span>
                                    </div>
                                `).join('')}
                            </div>
                    <div class="rv-card" style="padding:14px;border-color:rgba(168,85,247,0.35)">
                                <div class="rv-section-title" style="color:#A855F7">RAILVERSE AI ASSESSMENT</div>
                                <div style="font-size:14px;color:#E8F4FD;line-height:1.65">${res.ai_assessment}</div>
                            </div>

                            <!-- Risk Drivers -->
                            <div class="rv-card mt-3" style="padding:14px;border-color:rgba(255,179,0,0.3)">
                                <div class="rv-section-title text-cmd-warning mb-2" style="margin-bottom:8px">RISK DRIVERS (EVIDENCE)</div>
                                <ul class="list-none pl-1 space-y-1">
                                    ${(res.risk_drivers || []).map(d => `<li class="text-[12px] text-gray-300 flex items-start gap-2"><div class="w-1.5 h-1.5 rounded-full bg-cmd-warning mt-1.5 flex-shrink-0"></div><span>${d}</span></li>`).join('')}
                                </ul>
                            </div>

                            <!-- Comparison Table -->
                            <div class="rv-card mt-3" style="padding:14px;border-color:rgba(0,229,255,0.3)">
                                <div class="rv-section-title text-cmd-accent mb-2" style="margin-bottom:8px">SIMULATION COMPARISON (CURRENT VS POST-ACTION)</div>
                                <table class="w-full text-left text-[11px] border-collapse">
                                    <thead>
                                        <tr class="border-b border-gray-700 text-gray-500 uppercase">
                                            <th class="py-1 pb-2 font-normal w-1/3">Metric</th>
                                            <th class="py-1 pb-2 font-normal w-1/3">Current State</th>
                                            <th class="py-1 pb-2 font-normal w-1/3">Simulated Action</th>
                                        </tr>
                                    </thead>
                                    <tbody class="text-gray-300">
                                        <tr class="border-b border-gray-800/50">
                                            <td class="py-1.5 text-gray-400">Crowd Density</td>
                                            <td class="py-1.5 text-cmd-danger font-mono">${res.comparison?.current?.crowd_percent || "N/A"}</td>
                                            <td class="py-1.5 text-cmd-success font-mono">${res.comparison?.after_action?.crowd_percent || "N/A"}</td>
                                        </tr>
                                        <tr class="border-b border-gray-800/50">
                                            <td class="py-1.5 text-gray-400">Delay Cascade</td>
                                            <td class="py-1.5 text-cmd-warning font-mono">${res.comparison?.current?.delay || "N/A"}</td>
                                            <td class="py-1.5 font-mono">${res.comparison?.after_action?.delay || "N/A"}</td>
                                        </tr>
                                        <tr class="border-b border-gray-800/50">
                                            <td class="py-1.5 text-gray-400">Affected Trains</td>
                                            <td class="py-1.5 font-mono">${res.comparison?.current?.affected_trains || "N/A"}</td>
                                            <td class="py-1.5 font-mono">${res.comparison?.after_action?.affected_trains || "N/A"}</td>
                                        </tr>
                                        <tr>
                                            <td class="py-1.5 text-gray-400">Network Risk</td>
                                            <td class="py-1.5 font-bold ${res.comparison?.current?.network_risk === 'CRITICAL' ? 'text-cmd-danger blink' : 'text-cmd-warning'}">${res.comparison?.current?.network_risk || "N/A"}</td>
                                            <td class="py-1.5 font-bold ${res.comparison?.after_action?.network_risk === 'SAFE' ? 'text-cmd-success' : 'text-[#8BA8C8]'}">${res.comparison?.after_action?.network_risk || "N/A"}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            ${(res.risk_level === 'HIGH' || res.risk_level === 'CRITICAL') && res.safer_alternative ? `
                            <!-- Safer Alternative & Mitigation Checklist -->
                            <div class="rv-card mt-3" style="padding:16px;border-color:rgba(0,255,148,0.4);background:linear-gradient(180deg, rgba(0,255,148,0.05) 0%, transparent 100%)">
                                <div class="flex justify-between items-center mb-3">
                                    <div class="rv-section-title text-[#00FF94] m-0">SAFER ALTERNATIVE RECOMMENDED</div>
                                    <div class="text-right">
                                        <div class="text-[10px] text-gray-400 uppercase tracking-widest">Live Risk Score</div>
                                        <div id="mitigation-live-score" class="text-2xl font-bold font-mono text-red-400 leading-none">${res.overallScore}</div>
                                    </div>
                                </div>
                                <div class="text-gray-300 text-sm mb-4 leading-relaxed">${res.safer_alternative.description}</div>
                                
                                <div class="rv-section-title text-[#00FF94] mb-2 opacity-80" style="font-size:10px">MITIGATION CHECKLIST</div>
                                <div class="space-y-2">
                                    ${res.mitigation_checklist.map((step, idx) => `
                                        <label class="flex items-center gap-3 p-2 rounded-lg border border-gray-800 bg-gray-900/50 hover:bg-gray-800/80 cursor-pointer transition-colors">
                                            <input type="checkbox" class="mitigation-cb w-4 h-4 rounded border-gray-600 text-[#00FF94] focus:ring-[#00FF94] bg-gray-700" 
                                                   data-drop="${step.drops_to}" 
                                                   onchange="window.updateMitigationScore(${res.overallScore})">
                                            <span class="text-xs text-gray-300 flex-1">${step.action}</span>
                                            <span class="text-[10px] text-gray-500 font-mono tracking-wider flex items-center gap-1"><i data-lucide="trending-down" class="w-3 h-3 text-[#00FF94]"></i> ${step.drops_to}</span>
                                        </label>
                                    `).join('')}
                                </div>
                            </div>
                            ` : ''}
                        </div>

                        <!-- Multi-Agent Collaboration Simulation -->
                        <div class="rv-card mt-3" style="padding:14px;border-color:rgba(255,179,0,0.3)">
                            <div class="flex justify-between items-center mb-3 border-b border-gray-800 pb-2">
                                <div class="rv-section-title text-cmd-accent mb-0" style="margin-bottom:0">MULTI-AGENT COLLABORATION <span class="ml-2 px-2 py-0.5 bg-cmd-accent/20 text-cmd-accent text-[9px] rounded">SIMULATION</span></div>
                                <div class="text-cmd-danger text-[10px] blink border border-cmd-danger px-1">OPERATIONAL CONFLICT DETECTED</div>
                            </div>
                            
                            <div class="rv-agents-grid">
                                <!-- Operations -->
                                <div class="bg-[#000] border border-cmd-success/50 p-2 rounded">
                                    <div class="flex justify-between mb-1">
                                        <span class="text-[10px] text-gray-400 font-bold">OPERATIONS</span>
                                        <span class="text-[10px] text-cmd-success font-bold">SAFE</span>
                                    </div>
                                    <div class="text-[11px] text-gray-500 leading-tight mt-1">Route clearance verified. No track maintenance conflicts.</div>
                                </div>
                                
                                <!-- Scheduling -->
                                <div class="bg-[#000] border border-cmd-success/50 p-2 rounded">
                                    <div class="flex justify-between mb-1">
                                        <span class="text-[10px] text-gray-400 font-bold">SCHEDULING</span>
                                        <span class="text-[10px] text-cmd-success font-bold">SAFE</span>
                                    </div>
                                    <div class="text-[11px] text-gray-500 leading-tight mt-1">Timetable adjusted. Delays contained within 5 min buffer.</div>
                                </div>
                        
                                <!-- Platform -->
                                <div class="bg-[#000] border border-cmd-warning/50 p-2 rounded">
                                    <div class="flex justify-between mb-1">
                                        <span class="text-[10px] text-gray-400 font-bold">PLATFORM</span>
                                        <span class="text-[10px] text-cmd-warning font-bold">CAUTION</span>
                                    </div>
                                    <div class="text-[11px] text-gray-500 leading-tight mt-1">PF4 nearing capacity. Extra RPF deployment required.</div>
                                </div>
                        
                                <!-- Crowd -->
                                <div class="bg-[#000] border border-cmd-danger/50 p-2 rounded relative overflow-hidden">
                                    <div class="absolute top-0 right-0 w-1 h-full bg-cmd-danger blink opacity-50"></div>
                                    <div class="flex justify-between mb-1">
                                        <span class="text-[10px] text-gray-400 font-bold">CROWD</span>
                                        <span class="text-[10px] text-cmd-danger font-bold">BLOCK</span>
                                    </div>
                                    <div class="text-[11px] text-gray-500 leading-tight mt-1">Fatal crush risk at FOB 2. Density exceeds 6 pax/sqm.</div>
                                </div>
                        
                                <!-- Emergency -->
                                <div class="bg-[#000] border border-cmd-warning/50 p-2 rounded">
                                    <div class="flex justify-between mb-1">
                                        <span class="text-[10px] text-gray-400 font-bold">EMERGENCY</span>
                                        <span class="text-[10px] text-cmd-warning font-bold">CAUTION</span>
                                    </div>
                                    <div class="text-[11px] text-gray-500 leading-tight mt-1">Ambulance route B congested. Pre-positioning team.</div>
                                </div>
                            </div>
                            
                            <!-- Unified Resolution -->

        window.updateMitigationScore = function(initialScore) {
            const checkboxes = document.querySelectorAll('.mitigation-cb');
            let currentScore = initialScore;
            
            checkboxes.forEach(cb => {
                if (cb.checked) {
                    const dropTo = parseInt(cb.getAttribute('data-drop'), 10);
                    if (dropTo < currentScore) currentScore = dropTo;
                }
            });
            
            const scoreDisplay = document.getElementById('mitigation-live-score');
            if (scoreDisplay) {
                scoreDisplay.innerText = currentScore;
                if (currentScore <= 45) {
                    scoreDisplay.className = "text-2xl font-bold font-mono text-[#00FF94] leading-none transition-colors duration-500";
                } else if (currentScore <= 60) {
                    scoreDisplay.className = "text-2xl font-bold font-mono text-yellow-400 leading-none transition-colors duration-500";
                } else {
                    scoreDisplay.className = "text-2xl font-bold font-mono text-red-400 leading-none transition-colors duration-500";
                }
            }

            window.addAuditLog(`Mitigation checklist updated. Projected risk score lowered to ${currentScore}.`);

// // AI ACTION RISK & COLLABORATION CENTER

        let riskState = {
            status: 'READY', // READY, ANALYZING, AWAITING_APPROVAL, MITIGATION, READY_TO_EXECUTE, IN_PROGRESS, COMPLETED, FAILED, BLOCKED

            approvals: { sc: false, so: false, sec: false },
            approvalsRequested: false,
            mitigationApplied: false,
            actionName: '',

        function getRiskLevel(score) {
            if (score <= 25) return { lvl: 'LOW', col: 'text-cmd-success', bg: 'bg-cmd-success', border: 'border-cmd-success' };
            if (score <= 50) return { lvl: 'MEDIUM', col: 'text-cmd-warning', bg: 'bg-cmd-warning', border: 'border-cmd-warning' };
            if (score <= 75) return { lvl: 'HIGH', col: 'text-[#FF9500]', bg: 'bg-[#FF9500]', border: 'border-[#FF9500]' };
            return { lvl: 'CRITICAL', col: 'text-cmd-danger', bg: 'bg-cmd-danger', border: 'border-cmd-danger' };
        }

        function calculateActionRisk(action, location) {
            // Simulated rule-based engine using existing data concepts
            let baseScore = 40;

            if (action === 'emergency_platform') baseScore = 87; // High default risk due to crowding
            else if (action === 'reroute_train') baseScore = 72;
            else if (action === 'dispatch_special') baseScore = 65;
            else if (action === 'deploy_staff') baseScore = 15;
            else if (action === 'close_platform') baseScore = 91;

            
            // Kaggle realistic data injection
            const isKaggleData = true;
            let mockData = {
                overallScore: baseScore,
                categories: {
                    safety: Math.min(99, baseScore + 12),
                    network: Math.min(99, baseScore + 5),
                    operations: Math.max(10, baseScore - 5),
                    infra: baseScore,
                    env: 25
                },
                detectedRisks: [
                    { level: 'CRITICAL', title: 'Severe overcrowding on Platform 3', desc: 'Platform 2 predicted occupancy is currently at 94% capacity.' },
                    { level: 'HIGH', title: 'Cascading delays on the Northbound line', desc: 'Average punctuality drops to 41 minutes due to gridlock.' },
                    { level: 'WARNING', title: 'Potential stampede risk at the exit gates', desc: 'Two high-capacity commuter trains are scheduled to arrive in 7 minutes.' }
                ],
                mitigations: [
                    { title: 'Hold train 6 min + redirect passengers', expectedRisk: 45, recommended: true },
                    { title: 'Deploy RPF to South Concourse', expectedRisk: 55, recommended: false }
                ]
            };
            return mockData;

            /*
                overallScore: baseScore,
                categories: {
                    safety: Math.min(100, baseScore + 5),
                    network: Math.max(10, baseScore - 6),
                    operations: Math.max(15, baseScore - 13),
                    infra: Math.min(100, baseScore + 1),
                    env: 25
                },
                detectedRisks: [
                    { level: 'CRITICAL', title: 'Crowd capacity exceeded', desc: 'Expected crowd: 145,000<br>Safe capacity: 45,000' },
                    { level: 'HIGH', title: 'Staff shortage', desc: 'Required: 65<br>Available: 31' },
                    { level: 'HIGH', title: 'Train flow conflict', desc: 'Additional trains affected: 18' }
                ],
                mitigations: [
                    { id: 'optA', title: 'Deploy additional staff', expectedRisk: Math.floor(baseScore * 0.55), recommended: true },
                    { id: 'optB', title: 'Open alternate platform', expectedRisk: Math.floor(baseScore * 0.48), recommended: false },
                    { id: 'optC', title: 'Restrict passenger entry', expectedRisk: Math.floor(baseScore * 0.65), recommended: false }
                ],
                approvalRequired: baseScore > 50
            };
        }

        function updateRiskUIStatus() {
            document.getElementById('rs-status').innerText = `● ${riskState.status.replace(/_/g, ' ')}`;
            document.getElementById('rs-action').innerText = riskState.actionName;

            document.getElementById('rs-time').innerText = timeStr;

            document.getElementById('rs-risk-level').innerText = rl.lvl;
            document.getElementById('rs-risk-level').className = rl.col;

            let apprText = "Not Required";
            if (riskState.score > 50 || riskState.originalScore > 50) {
                const count = (riskState.approvals.sc ? 1 : 0) + (riskState.approvals.so ? 1 : 0) + (riskState.approvals.sec ? 1 : 0);

            updateRiskUIStatus();

            setTimeout(() => {
                const data = calculateActionRisk(select.value, riskState.location);
                riskState.score = data.overallScore;
                riskState.originalScore = data.overallScore;

                // Render categories
                const renderCat = (id, sc) => {
                    const l = getRiskLevel(sc);
                    document.getElementById(`rc-${id}-score`).innerText = sc;
                    document.getElementById(`rc-${id}-score`).className = `text-xl font-mono font-bold ${l.col}`;
                    document.getElementById(`rc-${id}-lbl`).innerText = l.lvl;
                    document.getElementById(`rc-${id}-lbl`).className = `text-[8px] mt-1 tracking-widest ${l.col}`;
                };
                renderCat('safety', data.categories.safety);
                renderCat('network', data.categories.network);
                renderCat('ops', data.categories.operations);
                renderCat('infra', data.categories.infra);
                renderCat('env', data.categories.env);

                // Render Detected Risks
                const drList = document.getElementById('detected-risks-list');
                drList.innerHTML = data.detectedRisks.map(r => {
                    const l = r.level === 'CRITICAL' ? 'text-cmd-danger border-cmd-danger bg-cmd-danger/10' : (r.level === 'HIGH' ? 'text-[#FF9500] border-[#FF9500] bg-[#FF9500]/10' : 'text-cmd-warning border-cmd-warning bg-cmd-warning/10');
                    return `
                        <div class="border-l-2 p-2 bg-[#000] ${l}">

                // Render Mitigations
                const mContainer = document.getElementById('mitigation-options');
                mContainer.innerHTML = data.mitigations.map((m, i) => `
                    <div class="p-3 bg-[#000] border border-gray-800 flex flex-col justify-between hover:border-cmd-accent transition-colors">

                            <div class="text-[10px] ${m.recommended ? 'text-cmd-success font-bold' : 'text-gray-500'} mb-1">OPTION ${String.fromCharCode(65 + i)} ${m.recommended ? '— RECOMMENDED' : ''}</div>

                            APPLY
                        </button>
                    </div>
                `).join('');

                // Reset Collaboration
                document.getElementById('collab-timeline').innerHTML = '';
                ['sc', 'so', 'sec'].forEach(id => {
                    document.getElementById(`appr-${id}`).innerText = 'PENDING';
                    document.getElementById(`appr-${id}`).className = 'text-cmd-warning blink';

                document.getElementById('btn-request-approvals').disabled = false;
                document.getElementById('btn-request-approvals').className = 'w-full mt-2 bg-cmd-warning/10 border border-cmd-warning text-cmd-warning hover:bg-cmd-warning hover:text-black transition-colors px-3 py-2 font-mono text-[12px] font-bold tracking-widest uppercase flex items-center justify-center gap-2';
                document.getElementById('btn-request-approvals').innerHTML = '<i data-lucide="send" class="w-3 h-3"></i> REQUEST APPROVALS';

                document.getElementById('risk-loading').classList.add('hidden');
                const results = document.getElementById('risk-results-container');
                results.classList.remove('hidden');
                results.classList.add('flex');

                void results.offsetWidth;
                results.classList.remove('opacity-0');
                results.classList.add('opacity-100');

                updateRiskUIStatus();
                if (window.lucide) window.lucide.createIcons();
            }, 1200);
        }

        function applyMitigation(title, newScore) {
            riskState.score = newScore;
            riskState.mitigationApplied = true;
            document.getElementById('rs-mitigation').innerText = title;
            document.getElementById('rs-mitigation').className = 'text-cmd-accent font-bold';

            // Update Big Score visually
            const rl = getRiskLevel(newScore);
            document.getElementById('risk-score-big').innerText = newScore;
            document.getElementById('risk-score-big').className = rl.col;
            const badge = document.getElementById('risk-level-badge');
            badge.innerText = rl.lvl;
            badge.className = `${rl.bg}/20 ${rl.col} ${rl.border} border px-3 py-1 font-mono text-xs font-bold tracking-widest uppercase`;

            // Reduce all sub-categories visually by a proportional amount
            const reduceScore = (id) => {
                const el = document.getElementById(`rc-${id}-score`);
                let v = parseInt(el.innerText);
                v = Math.floor(v * (newScore / riskState.originalScore));
                const l = getRiskLevel(v);
                el.innerText = v;
                el.className = `text-xl font-mono font-bold ${l.col}`;
                document.getElementById(`rc-${id}-lbl`).innerText = l.lvl;
                document.getElementById(`rc-${id}-lbl`).className = `text-[8px] mt-1 tracking-widest ${l.col}`;
            };
            ['safety', 'network', 'ops', 'infra', 'env'].forEach(reduceScore);

            checkReadyToExecute();
            updateRiskUIStatus();
        }

        function checkReadyToExecute() {
            if (riskState.approvals.sc && riskState.approvals.so && riskState.approvals.sec) {
                riskState.status = 'READY_TO_EXECUTE';
                updateRiskUIStatus();
            }
